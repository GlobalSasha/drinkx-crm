<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrinkX КП</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─────────────────────────────────────────────────────────────
   DrinkX Sales — дизайн-система
   Кремовая бумага, белые карточки, один оранжевый акцент.
   Плотность рассчитана на ноутбук: 1280×720 без прокрутки страницы.
   ───────────────────────────────────────────────────────────── */

:root{
  /* Поверхности */
  --bg:        #F1EFE9;
  --card:      #FFFFFF;
  --sunken:    #F7F5F1;

  /* Текст */
  --ink:       #16130F;
  --ink-2:     #57524A;
  --ink-3:     #8C867B;

  /* Линии */
  --line:      #E3DFD6;
  --line-soft: #EFECE5;

  /* Акценты */
  --brand:     #FF4E00;
  --brand-ink: #C93C00;
  --brand-bg:  #FFF1EA;
  --ok:        #1F7A46;
  --ok-bg:     #EDF6F0;
  --warn:      #C0362B;
  --warn-bg:   #FCEFEE;

  /* Радиусы */
  --r-xs: 6px;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;

  /* Тени */
  --sh-1: 0 1px 2px rgba(22,19,15,.05);
  --sh-2: 0 1px 2px rgba(22,19,15,.05), 0 6px 20px rgba(22,19,15,.06);
  --sh-pill: 0 1px 2px rgba(22,19,15,.14);

  /* Шаг сетки */
  --s-1: 4px;  --s-2: 8px;  --s-3: 12px;
  --s-4: 16px; --s-5: 20px; --s-6: 28px;

  --dur: .14s;
  --ease: cubic-bezier(.32,.72,.35,1);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:400 15px/1.45 'Golos Text',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.015em}
button{font:inherit; cursor:pointer; color:inherit}
input{font:inherit; color:inherit}
::selection{background:var(--brand); color:#fff}

/* Цифры выравниваются в колонку — это ценовой инструмент. */
.num{font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1; letter-spacing:-.01em}

/* ── Типографика ───────────────────────────────────────────── */
.t-display{font-size:clamp(30px,2.3vw,40px); font-weight:600; letter-spacing:-.03em; line-height:1.05}
.t-title  {font-size:16px; font-weight:600; letter-spacing:-.015em}
.t-body   {font-size:15px}
.t-meta   {font-size:13px; color:var(--ink-2)}
.t-micro  {font-size:12px; color:var(--ink-3)}
.t-label{
  font-size:11px; font-weight:600; text-transform:uppercase;
  letter-spacing:.09em; color:var(--ink-3);
}

/* ── Кнопки ────────────────────────────────────────────────── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  height:34px; padding:0 15px; border-radius:var(--r-sm);
  border:1px solid var(--line); background:var(--card);
  font-size:14px; font-weight:500; white-space:nowrap;
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease),
             color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(.5px)}
.btn:focus-visible{outline:2px solid var(--brand); outline-offset:2px}

.btn-dark{background:var(--ink); border-color:var(--ink); color:#fff}
.btn-dark:hover{background:#000; border-color:#000}

.btn-accent{background:var(--brand); border-color:var(--brand); color:#fff}
.btn-accent:hover{background:var(--brand-ink); border-color:var(--brand-ink)}

.btn-quiet{border-color:transparent; background:transparent; color:var(--ink-2)}
.btn-quiet:hover{background:var(--sunken); border-color:transparent; color:var(--ink)}

.btn-link{
  border:0; background:none; padding:0 2px; height:auto;
  font-size:13.5px; font-weight:500; color:var(--brand-ink);
}
.btn-link:hover{color:var(--brand); text-decoration:underline; text-underline-offset:3px}

.btn-sm{height:28px; padding:0 11px; font-size:13px}
.btn[disabled]{opacity:.45; pointer-events:none}

/* ── Переключатель ─────────────────────────────────────────── */
.seg{display:inline-flex; gap:2px; padding:3px; background:var(--sunken);
     border:1px solid var(--line); border-radius:10px}
.seg button{
  border:0; background:transparent; color:var(--ink-2);
  height:30px; padding:0 15px; border-radius:7px;
  font-size:14px; font-weight:500; white-space:nowrap;
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease),
             box-shadow var(--dur) var(--ease);
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:var(--sh-pill)}

/* ── Теги ──────────────────────────────────────────────────── */
.tag{
  display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 10px;
  border-radius:999px; background:var(--sunken); border:1px solid var(--line);
  font-size:11.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  color:var(--ink-2);
}
.tag-accent{background:var(--brand); border-color:var(--brand); color:#fff}
.tag-ok   {background:var(--ok-bg);   border-color:transparent; color:var(--ok)}
.tag-warn {background:var(--warn-bg); border-color:transparent; color:var(--warn)}

/* ── Карточки ──────────────────────────────────────────────── */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-md)}
.card + .card{margin-top:var(--s-3)}
.card-raised{box-shadow:var(--sh-2)}
.card-head{
  display:flex; align-items:center; gap:10px;
  padding:13px var(--s-5); border-bottom:1px solid var(--line);
}
.card-head .spread{margin-left:auto; display:flex; align-items:center; gap:2px}
.card-body{padding:var(--s-5)}
.card-foot{
  display:flex; align-items:center; padding:12px var(--s-5);
  border-top:1px solid var(--line); background:var(--sunken);
  border-radius:0 0 var(--r-md) var(--r-md); font-size:14px;
}
.card-foot b{margin-left:auto; font-weight:600}

/* ── Строка списка ─────────────────────────────────────────
   Две строки во всю ширину колонки: название с суммой, пояснение
   со счётчиком. В узкой колонке ничего не переносится по три раза. */
.row{
  position:relative; display:block;
  padding:11px var(--s-5) 11px calc(var(--s-5) - 2px);
  border-bottom:1px solid var(--line-soft);
  border-left:2px solid transparent;
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunken)}
/* Оранжевая грань отмечает выбранное там, где выбор — исключение:
   в поштучной продаже. В станции по умолчанию включено всё, и метка
   на каждой строке превратилась бы в сплошную полосу без смысла. */
.rows-2 .row.on{border-left-color:var(--brand)}
.row.off{color:var(--ink-3)}

.row .top{display:flex; align-items:baseline; gap:10px}
.row .top b{flex:1; min-width:0; font-size:15px; font-weight:600; letter-spacing:-.008em}
.row.off .top b{font-weight:500}
.row .amt{font-size:15px; font-weight:500; white-space:nowrap}
.row.off .amt{color:var(--ink-3); font-weight:400}

.row .bot{display:flex; align-items:center; gap:10px; margin-top:4px}
.row .bot small{flex:1; min-width:0; font-size:12.5px; color:var(--ink-3); line-height:1.35}

/* ── Счётчик ───────────────────────────────────────────────── */
.stepper{display:inline-flex; align-items:center; border:1px solid var(--line);
         border-radius:var(--r-sm); background:var(--card); overflow:hidden}
.stepper button{
  width:30px; height:30px; border:0; background:transparent; color:var(--ink-3);
  font-size:16px; line-height:1; transition:background var(--dur), color var(--dur);
}
.stepper button:hover{background:var(--sunken); color:var(--ink)}
.stepper input{
  width:40px; height:30px; border:0; background:transparent; text-align:center;
  font-size:14.5px; font-weight:600; font-variant-numeric:tabular-nums;
  -moz-appearance:textfield;
}
.stepper input::-webkit-outer-spin-button,
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
.stepper input:focus{outline:0}
.stepper:focus-within{border-color:var(--ink-3)}

/* ── Поля ──────────────────────────────────────────────────── */
.field{
  height:34px; width:100%; padding:0 11px;
  border:1px solid var(--line); border-radius:var(--r-sm); background:var(--card);
  font-size:14px; transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.field::placeholder{color:var(--ink-3)}
.field:hover{border-color:var(--ink-3)}
.field:focus{outline:0; border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-bg)}
.field-num{width:86px; text-align:right; height:30px; font-variant-numeric:tabular-nums}

.form-row{display:flex; align-items:center; gap:var(--s-3); padding:7px 0}
.form-row .k{flex:1; font-size:13.5px; color:var(--ink-2)}

/* ── Слайдер ───────────────────────────────────────────────── */
.slider-head{display:flex; align-items:baseline; font-size:13.5px; color:var(--ink-2)}
.slider-head b{margin-left:auto; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}
input[type=range]{
  -webkit-appearance:none; appearance:none; width:100%; height:20px;
  background:transparent; margin:2px 0 0;
}
input[type=range]::-webkit-slider-runnable-track{
  height:4px; border-radius:999px; background:var(--line);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; width:15px; height:15px; margin-top:-5.5px;
  border-radius:50%; background:var(--card); border:1px solid var(--line);
  box-shadow:var(--sh-pill); transition:transform var(--dur) var(--ease);
}
input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]:active::-webkit-slider-thumb{background:var(--brand); border-color:var(--brand)}
input[type=range]::-moz-range-track{height:4px; border-radius:999px; background:var(--line)}
input[type=range]::-moz-range-thumb{
  width:14px; height:14px; border-radius:50%; background:var(--card);
  border:1px solid var(--line); box-shadow:var(--sh-pill);
}

/* ── Пара «ключ — значение» ────────────────────────────────── */
.kv{display:flex; align-items:baseline; padding:8px 0; font-size:13.5px;
    border-bottom:1px dashed var(--line-soft)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-2)}
.kv .v{margin-left:auto; font-weight:500; font-variant-numeric:tabular-nums}
.kv-ok   .v{color:var(--ok)}
.kv-warn .v{color:var(--warn)}

/* ── Информационный блок ───────────────────────────────────── */
.info{
  display:flex; gap:8px; padding:10px 12px; border-radius:var(--r-sm);
  background:var(--sunken); font-size:12.5px; line-height:1.45; color:var(--ink-2);
}
.info::before{content:'·'; font-weight:700; color:var(--ink-3); line-height:1}
.info-warn{background:var(--warn-bg); color:var(--warn)}
.info-warn::before{content:'!'; color:var(--warn)}
.info-ok{background:var(--ok-bg); color:var(--ok)}
.info-ok::before{content:'✓'; color:var(--ok)}

/* ── Группа параметров ─────────────────────────────────────── */
.group{margin-top:var(--s-4)}
.group:first-child{margin-top:0}
.group > .t-label{display:block; margin-bottom:2px}

:root{color-scheme:light}
html{background:var(--bg)}
</style>
<style>
.topbar{position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; align-items:center; gap:12px;
  padding:10px 20px; background:var(--card); border-bottom:1px solid var(--line)}
.mark{font-size:17px; font-weight:700; letter-spacing:-.025em; white-space:nowrap}
.mark i{font-style:normal; color:var(--brand)}
.mark span{color:var(--ink-3); font-weight:500}
.grow{flex:1}

.main{display:grid; gap:14px; padding:14px 20px; align-items:start;
  grid-template-columns:minmax(0,1fr) minmax(380px,460px)}
.main.kpview{grid-template-columns:minmax(320px,380px) minmax(0,1fr)}
@media (max-width:1040px){ .main, .main.kpview{grid-template-columns:minmax(0,1fr)} }
.stick{position:sticky; top:70px}
@media (max-width:1040px){ .stick{position:static} }

.field{width:100%; height:34px; padding:0 10px; border:1px solid var(--line); border-radius:var(--r-sm);
  background:var(--card); font-size:14px}
textarea.field{height:auto; min-height:76px; padding:8px 10px; resize:vertical; line-height:1.4}
.field:focus{outline:2px solid var(--brand); outline-offset:-1px; border-color:transparent}
.fl{display:block; margin-top:10px}
.fl > span{display:block; margin-bottom:4px}
.inl{display:flex; gap:12px; flex-wrap:wrap}
.inl > label{flex:1 1 120px}
.num-in{width:84px; text-align:right}

/* Строка конфигурации */
.line-head{display:flex; flex-wrap:wrap; align-items:center; gap:10px}
.line-head select.field{width:auto; min-width:220px; font-weight:600}
.presets{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px}
.chip{height:30px; padding:0 12px; border:1px solid var(--line); border-radius:999px; background:var(--card);
  font-size:13px; font-weight:500; color:var(--ink-2)}
.chip:hover{border-color:var(--ink-3); color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:#fff}
.chip:focus-visible{outline:2px solid var(--brand); outline-offset:2px}

table.it{width:100%; border-collapse:collapse; margin-top:12px; font-size:13.5px}
table.it th{font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3);
  text-align:right; padding:6px 6px; border-bottom:1px solid var(--line)}
table.it th:first-child, table.it td:first-child{text-align:left; padding-left:0}
table.it td{padding:5px 6px; border-bottom:1px solid var(--line-soft); text-align:right; vertical-align:middle}
table.it tr.in td:first-child b{color:var(--ink)}
table.it tr.out td{color:var(--ink-3)}
table.it tr.out td:first-child b{font-weight:500; color:var(--ink-2)}
table.it small{display:block; color:var(--ink-3); font-size:12px}
.step{display:inline-flex; align-items:center; gap:2px}
.step button{width:24px; height:24px; border:1px solid var(--line); border-radius:6px; background:var(--card); line-height:1}
.step button:hover{border-color:var(--ink-3)}
.step b{min-width:22px; text-align:center; font-weight:600}
.step b.z{color:var(--ink-3); font-weight:400}

/* Сводка */
.sum-line{padding:12px 0; border-bottom:1px solid var(--line-soft)}
.sum-line:last-child{border-bottom:0}
.kv{display:grid; grid-template-columns:1fr auto; gap:3px 12px; font-size:13.5px; margin-top:6px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0; text-align:right}
.kv .big{font-size:15px; font-weight:600; color:var(--ink)}
.ok{color:var(--ok)} .bad{color:var(--warn)} .amber{color:#9A5B00}
.note{margin-top:8px; padding:8px 10px; border-radius:var(--r-sm); font-size:12.5px; line-height:1.4}
.note.w{background:var(--warn-bg); color:var(--warn)}
.note.a{background:#FFF6E5; color:#7A4800}
.total{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding-top:12px}
.total b{font-size:22px; letter-spacing:-.02em}

/* Документ КП: те же стили уходят в выгрузку для Word */
.card-body{overflow-x:auto}
.paper{overflow-x:auto; background:#fff; border:1px solid var(--line); border-radius:var(--r-md); box-shadow:var(--sh-2);
  max-width:820px; margin:0 auto; padding:44px 52px}
@media (max-width:700px){ .paper{padding:24px 18px} }

@media print{
  @page{size:A4; margin:16mm 14mm}
  body{background:#fff}
  .topbar, .no-print{display:none !important}
  .main, .main.kpview{display:block; padding:0}
  .paper{border:0; box-shadow:none; padding:0; max-width:none}
}
</style>
<style id="doc-css">
.doc{color:#16130F; font:400 13.5px/1.5 'Golos Text',Arial,sans-serif}
.doc .d-top{display:flex; justify-content:space-between; gap:20px; align-items:flex-start; padding-bottom:14px; border-bottom:2px solid #16130F}
.doc .d-logo{font-size:24px; font-weight:700; letter-spacing:-.03em}
.doc .d-logo i{font-style:normal; color:#FF4E00}
.doc .d-req{font-size:11.5px; color:#57524A; text-align:right; white-space:pre-line; max-width:320px}
.doc h1{font-size:26px; letter-spacing:-.02em; margin:26px 0 4px; font-weight:600}
.doc .d-sub{font-size:15px; margin:0}
.doc .d-meta{font-size:12px; color:#8C867B; margin:6px 0 0}
.doc h2{font-size:16px; font-weight:600; margin:28px 0 10px}
.doc p{margin:8px 0}
.doc ul{margin:6px 0; padding-left:20px}
.doc table{width:100%; border-collapse:collapse; margin:8px 0; font-size:12.5px}

.doc td.c, .doc th.c{text-align:center}
.doc td.r, .doc th.r{text-align:right; white-space:nowrap}
.doc tr.tot td{font-weight:700; background:#FAF9F6}
.doc .d-name{font-weight:600}

<body>
<div class="topbar">
  <div class="mark">Drink<i>X</i> <span>· КП</span></div>
  <div class="seg" id="view" role="group" aria-label="Экран">
    <button data-v="calc">Расчёт</button><button data-v="kp">Документ КП</button>
  </div>
  <div class="seg" id="mode" role="group" aria-label="Тип КП">
    <button data-m="choice" title="Клиент выбирает одну комплектацию, общей суммы нет">Варианты на выбор</button>
    <button data-m="order" title="Все строки — один заказ, с итоговой суммой">Один заказ</button>
  </div>
  <div class="seg" id="vat" role="group" aria-label="НДС">
    <button data-vat="0">Без НДС</button><button data-vat="1">С НДС 22%</button>
  </div>
  <div class="grow"></div>
  <button class="btn btn-dark" id="copy">Скопировать КП</button>
  <button class="btn" id="prn">Печать / PDF</button>
  <button class="btn" id="doc">Скачать для Word</button>
  <button class="btn btn-quiet" id="rst">Сброс</button>
</div>
<div class="main" id="main"></div>

<script>
/* DrinkX — конфигуратор КП. Себестоимость, пресеты, скидки.
   Правьте здесь, страница offer.html подхватит.

   Источники (сверка 2026-11-17):
   - себестоимость — DrinkX_Calculator_Offers.xlsx, лист «Цена прайсовая», колонка C;
   - состав пресетов — DrinkX_Product_Pricing_Matrix_2026_v2.docx;
   - целевая прибыль — решение владельца 2026-11-17: AeroMilk 200 000 ₽,
     каждая станция 300 000 ₽ с единицы, до скидок.
   Цена пресета = (себестоимость + целевая прибыль) / (1 − headroom), вверх до 1 000 ₽:
   при максимальной объёмной скидке прибыль остаётся не ниже целевой. */

window.OFFER = {

  /* cost   — себестоимость за единицу, ₽ без НДС
     markup — множитель цены, когда позиция идёт сверх пресета или в своей сборке
              (как в CSV: модули ×1,7, MilkSwitch ×1,8, опции ×1,1)
     kind   — module | option
     auto   — позиция ставится сама, когда в составе есть указанная (решения
              владельца 2026-11-17: Control Unit и MilkX — вместе с MilkSwitch)
     lock   — вручную не добавляется: Control Unit бывает только при MilkSwitch */
  items: [
    { id: 'AM',  kind: 'module', cost: 144809,    markup: 1.7, name: 'AeroMilk',        desc: 'молочный модуль, капучинатор' },

</script>
<script>
(function(){
const D = window.OFFER;
const ITEM = Object.fromEntries(D.items.map(i => [i.id, i]));
const PRESET = Object.fromEntries(D.presets.map(p => [p.id, p]));
const KEY = 'drinkx-offer-v1';

const fmt = new Intl.NumberFormat('ru-RU', {maximumFractionDigits:0});
const money = n => fmt.format(Math.round(n)) + ' ₽';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => new Date().toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'});

const DEFAULT_EXCL = 'Мебель, если её нет в комплектации: рассчитывается отдельно под дизайн-проект кофейной зоны.\n' +
  'Системы водоснабжения и водоотведения: рассчитываются отдельно в зависимости от условий объекта.\n' +
  'Холодильник для комплектаций без MilkX: подходит любой, приобретается отдельно.';

function fresh(){
  return {
    view:'calc', mode:'choice', vat:false,
    lines:[ newLine('s100') ],
    svc: Object.fromEntries(D.services.map(s => [s.id, {on:false, qty:1, price:s.price}])),
    kp:{ client:'', num:'', date:today(), req:'[Реквизиты: юрлицо, ИНН, адрес]',
         intro:'', excl:DEFAULT_EXCL, term:'', pay:'', warranty:'', ship:'', valid:'',
         contact:'[ФИО, должность]\n[Телефон] · [E-mail]', tiers:true }
  };
}
function newLine(preset){ return {preset, qty:1, disc:0, extra:{}}; }

let S;
try { S = JSON.parse(localStorage.getItem(KEY)) } catch(e) {}
if (!S || !S.lines || !S.kp) S = fresh();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch(e) {} };

/* ─── Расчёт ─── */
const addonPrice = id => Math.round(ITEM[id].cost * ITEM[id].markup);
const costOf = items => Object.entries(items).reduce((s,[id,q]) => s + ITEM[id].cost*q, 0);
function presetPrice(p){
  if (p.id === 'custom') return 0;
  if (p.price) return p.price;
  return Math.ceil((costOf(p.items) + D.profit[p.type]) / (1 - D.headroom) / 1000) * 1000;
}
const tiersOf = type => (D.tiersByType && D.tiersByType[type]) || D.tiers;
const tierFor = (q, type) => tiersOf(type).reduce((t, x) => q >= x.from ? x : t, tiersOf(type)[0]);

function calc(l){
  const p = PRESET[l.preset];
  const comp = {...p.items};
  let list = presetPrice(p);
  for (const [id,q] of Object.entries(l.extra)) if (q > 0 && !ITEM[id].lock && (!p.options || p.options.includes(id))){
    comp[id] = (comp[id]||0) + q;
    list += addonPrice(id) * q;
  }
  /* Позиции «auto» (Control Unit, MilkX) ставятся сами, если в составе есть MilkSwitch */
  D.items.forEach(it => {
    if (it.auto && comp[it.auto] && !comp[it.id]){ comp[it.id] = 1; list += addonPrice(it.id); }
  });
  const cost = costOf(comp);
  const qty = Math.max(1, l.qty|0);
  const tier = tierFor(qty, p.type);
  const m = Math.min(Math.max(+l.disc||0, 0), 90) / 100;
  const afterTier = list * (1 - tier.pct/100);
  const unit = Math.round(afterTier * (1 - m));
  const profit = unit - cost;
  const floor = D.floor[p.type];
  const maxM = afterTier > 0 ? Math.max(0, 1 - (cost + floor) / afterTier) : 0;
  const discPct = list > 0 ? 1 - unit/list : 0;
  return {p, comp, list, cost, qty, tier, m, unit, profit, floor, maxM, discPct,
          total: unit*qty, profitTotal: profit*qty, empty: Object.keys(comp).length === 0};
}
const svcLines = () => D.services.filter(s => S.svc[s.id] && S.svc[s.id].on).map(s => {
  const v = S.svc[s.id], price = v.price === null || v.price === '' ? null : +v.price;
  return {s, qty: Math.max(1, v.qty|0), price, cost: s.cost};
});
const vatK = () => S.vat ? 1 + D.vat : 1;
/* Одинаковые пресеты в разных строках нумеруются, иначе в КП их не различить */
function lineName(l, i){
  const same = S.lines.filter(x => x.preset === l.preset);
  const k = S.lines.slice(0, i+1).filter(x => x.preset === l.preset).length;
  return PRESET[l.preset].name + (same.length > 1 ? ', вариант ' + k : '');
}

/* ─── Отрисовка ─── */
const $main = document.getElementById('main');

function render(){
  document.querySelectorAll('#view button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.view));
  document.querySelectorAll('#mode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === S.mode));
  document.querySelectorAll('#vat button').forEach(b => b.setAttribute('aria-pressed', (b.dataset.vat === '1') === S.vat));
  $main.className = 'main' + (S.view === 'kp' ? ' kpview' : '');
  if (S.view === 'calc'){
    $main.innerHTML = '<div id="ed"></div><div class="stick no-print" id="sum"></div>';
    renderEditor(); renderSummary();
  } else {
    $main.innerHTML = '<div class="no-print" id="kpf"></div><div class="paper"><div class="doc" id="docv"></div></div>';
    renderKpForm(); renderDoc();
  }
  save();
}

function renderEditor(){
  let h = '';
  S.lines.forEach((l, i) => {
    const c = calc(l);
    h += '<div class="card"><div class="card-body">' +
      '<div class="line-head"><span class="t-label">Строка ' + (i+1) + '</span>' +
      '<b class="t-title">' + esc(lineName(l,i)) + '</b>' +
      (S.lines.length > 1 ? '<span class="grow"></span><button class="btn btn-quiet btn-sm" data-del="'+i+'">Удалить</button>' : '') +
      '</div>' +
      '<div class="presets" role="group" aria-label="Комплектация">' +
      D.presets.map(p => '<button class="chip" data-line="'+i+'" data-preset="'+p.id+'" aria-pressed="'+(l.preset===p.id)+'">'+esc(p.name)+'</button>').join('') +
      '</div>' +
      '<div class="inl">' +
        '<label class="fl"><span class="t-label">Количество, шт</span><input class="field num num-in" type="number" min="1" step="1" data-line="'+i+'" data-f="qty" value="'+c.qty+'"></label>' +
        '<label class="fl"><span class="t-label">Доп. скидка, %</span><input class="field num num-in" type="number" min="0" max="90" step="0.5" data-line="'+i+'" data-f="disc" value="'+(+l.disc||0)+'"></label>' +
        '<div class="fl"><span class="t-label">Объёмная скидка</span><div class="t-body num" style="height:34px;display:flex;align-items:center" data-tier="'+i+'">'+c.tier.pct+'%</div></div>' +
      '</div>' +
      itemsTable(l, i) +
      '</div></div>';
  });
  h += '<div style="margin-top:12px"><button class="btn" id="add">Добавить строку</button></div>';
  h += servicesCard();
  document.getElementById('ed').innerHTML = h;
}

function itemsTable(l, i){
  const p = PRESET[l.preset];
  let h = '<table class="it"><thead><tr><th>Позиция</th><th>В комплекте</th><th>Сверх</th><th>Цена сверх, ед.</th></tr></thead><tbody>';
  const comp = calc(l).comp;
  /* У пресета со списком options (AeroMilk) видны только состав, эти опции и то, что встало само */
  const shown = p.options ? D.items.filter(it => p.items[it.id] || p.options.includes(it.id) || comp[it.id]) : D.items;
  shown.forEach(it => {
    const inP = p.items[it.id] || 0, ex = l.extra[it.id] || 0;
    if (it.lock){
      const on = comp[it.id] && !inP;
      h += '<tr class="'+(inP||on ? 'in' : 'out')+'"><td><b>'+esc(it.name)+'</b><small>'+esc(it.desc)+'</small></td>' +
        '<td class="num">'+(inP || '—')+'</td><td class="t-micro" style="text-align:center">'+(on ? '1, авто' : 'авто')+'</td>' +
        '<td class="num">'+money(addonPrice(it.id))+'</td></tr>';
      return;
    }
    if (p.options && !p.options.includes(it.id)){
      h += '<tr class="in"><td><b>'+esc(it.name)+'</b><small>'+esc(it.desc)+'</small></td>' +
        '<td class="num">'+inP+'</td><td class="t-micro" style="text-align:center">—</td><td></td></tr>';
      return;
    }
    const autoOn = it.auto && comp[it.id] && !inP && !ex;
    h += '<tr class="'+(inP||ex||autoOn ? 'in' : 'out')+'"><td><b>'+esc(it.name)+'</b><small>'+esc(it.desc)+(autoOn ? ' · добавлен с MilkSwitch' : '')+'</small></td>' +
      '<td class="num">'+(inP || '—')+'</td>' +
      '<td><span class="step"><button aria-label="Меньше" data-line="'+i+'" data-x="'+it.id+'" data-d="-1">−</button>' +
      '<b class="num'+(ex?'':' z')+'">'+ex+'</b>' +
      '<button aria-label="Больше" data-line="'+i+'" data-x="'+it.id+'" data-d="1">+</button></span></td>' +
      '<td class="num">'+money(addonPrice(it.id))+'</td></tr>';
  });
  return h + '</tbody></table>' +
    (p.id === 'custom' ? '<p class="t-micro" style="margin:8px 0 0">В своей сборке каждая позиция идёт по цене «сверх»: себестоимость × наценка из CSV.</p>' :
     '<p class="t-micro" style="margin:8px 0 0">Убрать модуль из пресета нельзя. Для урезанного состава выберите «Своя сборка».</p>');
}

function servicesCard(){
  let h = '<div class="card" style="margin-top:12px"><div class="card-head"><h2 class="t-title">Услуги</h2><span class="t-micro">объёмная скидка не действует</span></div><div class="card-body">' +
    '<table class="it" style="margin-top:0"><thead><tr><th>Услуга</th><th>Кол-во</th><th>Цена, ед.</th></tr></thead><tbody>';
  D.services.forEach(s => {
    const v = S.svc[s.id];
    h += '<tr class="'+(v.on?'in':'out')+'"><td><label style="display:flex;gap:8px;align-items:flex-start;cursor:pointer">' +
      '<input type="checkbox" data-svc="'+s.id+'" data-f="on" '+(v.on?'checked':'')+'><span><b>'+esc(s.name)+'</b><small>'+esc(s.desc || '')+'</small></span></label></td>' +
      '<td><input class="field num num-in" style="width:64px" type="number" min="1" data-svc="'+s.id+'" data-f="qty" value="'+(v.qty||1)+'"></td>' +
      '<td><input class="field num num-in" style="width:120px" type="number" min="0" placeholder="по согл." data-svc="'+s.id+'" data-f="price" value="'+(v.price===null?'':Math.round(v.price))+'"></td></tr>';
  });
  return h + '</tbody></table><p class="t-micro" style="margin:8px 0 0">Пустая цена — в КП будет «по согласованию», в сумму не входит. ПНР и консалтинг в прайсе стоят по себестоимости, без прибыли.</p></div></div>';
}

function renderSummary(){
  const el = document.getElementById('sum'); if (!el) return;
  let h = '<div class="card card-raised"><div class="card-head"><h2 class="t-title">Для менеджера</h2><span class="t-micro">без НДС</span></div><div class="card-body" style="padding-top:4px">';
  let tot = 0, tp = 0, cost = 0;
  S.lines.forEach((l, i) => {
    const c = calc(l);
    tot += c.total; tp += c.profitTotal; cost += c.cost*c.qty;
    const cls = c.profit < 0 ? 'bad' : c.profit < c.floor ? 'amber' : 'ok';
    h += '<div class="sum-line"><b>'+esc(lineName(l,i))+'</b> <span class="t-micro">× '+c.qty+' шт</span>' +
      (c.empty ? '<div class="note a">Состав пустой — добавьте позиции.</div>' :
      '<dl class="kv num">' +
        '<dt>Прайс за ед.</dt><dd>'+money(c.list)+'</dd>' +
        '<dt>Скидка всего</dt><dd>'+(c.discPct*100).toFixed(1).replace('.',',')+'%</dd>' +
        '<dt>Цена клиенту за ед.</dt><dd class="big">'+money(c.unit)+'</dd>' +
        '<dt>Себестоимость за ед.</dt><dd>'+money(c.cost)+'</dd>' +
        '<dt>Прибыль за ед.</dt><dd class="big '+cls+'">'+money(c.profit)+'</dd>' +
        '<dt>Наценка / маржа</dt><dd>'+pct(c.profit/c.cost)+' / '+pct(c.profit/c.unit)+'</dd>' +
      '</dl>' +
      (c.profit < 0 ? '<div class="note w">Цена ниже себестоимости на '+money(-c.profit)+' за единицу.</div>' :
       c.profit < c.floor ? '<div class="note a">Прибыль ниже минимума '+money(c.floor)+'. Без согласования с руководителем не отправлять.</div>' :
       '<div class="t-micro" style="margin-top:6px">Доп. скидка до минимальной прибыли: до '+(c.maxM*100).toFixed(1).replace('.',',')+'%</div>')) +
      '</div>';
  });
  const sv = svcLines();
  let svT = 0, svP = 0;
  sv.forEach(x => { if (x.price !== null){ svT += x.price*x.qty; svP += (x.price - x.cost)*x.qty; } });
  if (sv.length) h += '<div class="sum-line"><b>Услуги</b><dl class="kv num"><dt>Сумма</dt><dd>'+money(svT)+'</dd><dt>Прибыль</dt><dd>'+money(svP)+'</dd></dl></div>';
  if (S.mode === 'order'){
    h += '<div class="total"><span class="t-label">Итого заказ</span><b class="num">'+money(tot+svT)+'</b></div>' +
      '<dl class="kv num"><dt>Прибыль заказа</dt><dd class="big '+(tp+svP<0?'bad':'ok')+'">'+money(tp+svP)+'</dd>' +
      (S.vat ? '<dt>С НДС 22% для клиента</dt><dd>'+money((tot+svT)*vatK())+'</dd>' : '') + '</dl>';
  } else {
    h += '<p class="t-micro" style="margin:10px 0 0">Варианты на выбор: общей суммы нет, клиент берёт одну строку.</p>';
  }
  h += '</div></div>' +
    '<p class="t-micro" style="margin:10px 2px">Цена пресета = (себестоимость + прибыль AeroMilk '+money(D.profit.aeromilk)+' / станция '+money(D.profit.station)+') ÷ (1 − '+Math.round(D.headroom*100)+'%), вверх до 1&nbsp;000&nbsp;₽: при скидке '+Math.round(D.headroom*100)+'% прибыль не ниже минимума. ' +
    'Объёмная скидка на станции: '+D.tiers.filter(t=>t.pct).map(t=>'от '+t.from+' шт — '+t.pct+'%').join(', ')+'; на AeroMilk: '+tiersOf('aeromilk').filter(t=>t.pct).map(t=>'от '+t.from+' шт — '+t.pct+'%').join(', ')+'.</p>';
  el.innerHTML = h;
}
const pct = x => isFinite(x) ? (x*100).toFixed(1).replace('.',',') + '%' : '—';

/* ─── Документ КП ─── */
function renderKpForm(){
  const k = S.kp;
  const f = (key, label, ph, ta) => '<label class="fl"><span class="t-label">'+label+'</span>' +
    (ta ? '<textarea class="field" data-kp="'+key+'" placeholder="'+esc(ph||'')+'">'+esc(k[key])+'</textarea>'
        : '<input class="field" data-kp="'+key+'" placeholder="'+esc(ph||'')+'" value="'+esc(k[key])+'">') + '</label>';
  document.getElementById('kpf').innerHTML =
    '<div class="card"><div class="card-head"><h2 class="t-title">Шапка</h2></div><div class="card-body" style="padding-top:6px">' +
      f('client','Клиент','Название сети или компании') +
      '<div class="inl">'+f('num','Номер КП','—')+f('date','Дата')+'</div>' +
      f('req','Реквизиты DrinkX','',true) +
      f('intro','Вступление','Пусто — текст соберётся сам',true) +
    '</div></div>' +
    '<div class="card"><div class="card-head"><h2 class="t-title">Условия</h2></div><div class="card-body" style="padding-top:6px">' +
      f('term','Срок поставки','уточнить') + f('pay','Условия оплаты','уточнить') +
      f('warranty','Гарантия','уточнить') + f('ship','Доставка','уточнить') + f('valid','Срок действия предложения','уточнить') +
      f('excl','Что не входит в стоимость (строка — пункт)','',true) +
      f('contact','Контакты','',true) +
      '<label class="fl" style="display:flex;gap:8px;align-items:center;cursor:pointer"><input type="checkbox" data-kp="tiers" '+(k.tiers?'checked':'')+'> <span class="t-meta">Показать цены по объёму заказа</span></label>' +
    '</div></div>';
}

function renderDoc(){
  const el = document.getElementById('docv'); if (!el) return;
  el.innerHTML = docHtml();
}

function docHtml(){
  const k = S.kp, L = S.lines.map((l,i) => ({l, i, c:calc(l), name:lineName(l,i)})).filter(x => !x.c.empty);
  const vk = vatK(), vatTxt = S.vat ? 'Цены указаны с НДС 22%.' : 'Цены указаны без НДС: DrinkX применяет ст. 145.1 НК РФ.';
  const client = k.client ? '«' + esc(k.client) + '»' : '«__________»';
  const many = L.length > 1;
  let h = '<div class="d-top"><div class="d-logo">Drink<i>X</i></div><div class="d-req">'+esc(k.req)+'</div></div>' +
    '<h1>Коммерческое предложение</h1>' +
    '<p class="d-sub">Оборудование DrinkX для '+client+'</p>' +
    '<p class="d-meta">№ '+esc(k.num || '—')+' от '+esc(k.date)+'</p>';

  const intro = k.intro.trim() || (many
    ? (S.mode === 'choice'
        ? 'Предлагаем ' + L.length + ' ' + plural(L.length,'комплектацию','комплектации','комплектаций') + ' оборудования DrinkX на выбор. Система готовит напитки по цифровым рецептурам и поставляется как готовое оборудование. Комплектации различаются набором напитков.'
        : 'Предлагаем поставку оборудования DrinkX. Система готовит напитки по цифровым рецептурам и поставляется как готовое оборудование.')
    : 'Предлагаем ' + (L[0] ? L[0].name : 'оборудование DrinkX') + '. Оборудование готовит напитки по цифровым рецептурам и поставляется готовым к подключению.');
  h += '<p>'+esc(intro)+'</p>';

  /* 1. Комплектации */
  h += '<h2>1. '+(many?'Комплектации':'Комплектация')+'</h2>';
  L.forEach(x => {
    h += '<p class="d-var"><span class="d-name">'+esc(x.name)+'</span>' + (x.c.p.title && x.c.p.id!=='custom' ? ' — '+esc(x.c.p.title.toLowerCase()) : '') +
      (x.c.p.can ? '. '+esc(x.c.p.can) : '') + '</p>';
  });
  const used = D.items.filter(it => L.some(x => x.c.comp[it.id]));
  h += '<table><thead><tr><th>Состав</th>' + L.map(x => '<th class="c">'+esc(x.name)+'</th>').join('') + '</tr></thead><tbody>' +
    used.map(it => '<tr><td><b>'+esc(it.name)+'</b> — '+esc(it.desc)+'</td>' +
      L.map(x => { const q = x.c.comp[it.id] || 0; return '<td class="c">'+(q===0?'—':q===1?'✓':q+' шт.')+'</td>'; }).join('') + '</tr>').join('') +
    '</tbody></table>';

  /* 2. Что не входит */
  const ex = k.excl.split('\n').map(s => s.trim()).filter(Boolean);
  if (ex.length) h += '<h2>2. Что не входит в стоимость</h2><ul>' + ex.map(s => '<li>'+esc(s)+'</li>').join('') + '</ul>';

  /* 3. Стоимость */
  const n = ex.length ? 3 : 2;
  const anyDisc = L.some(x => x.c.discPct > 0.0005);
  h += '<h2>'+n+'. Стоимость</h2><table><thead><tr><th>'+(many?'Комплектация':'Позиция')+'</th><th class="r">Кол-во</th>' +
    (anyDisc ? '<th class="r">Цена по прайсу</th><th class="r">Скидка</th>' : '') +
    '<th class="r">Цена за 1 шт., ₽</th><th class="r">Сумма, ₽</th></tr></thead><tbody>';
  let tot = 0;
  L.forEach(x => {
    tot += x.c.total;
    h += '<tr><td class="d-name">'+esc(x.name)+'</td><td class="r">'+x.c.qty+' шт.</td>' +
      (anyDisc ? '<td class="r">'+fmt.format(Math.round(x.c.list*vk))+'</td><td class="r">'+(x.c.discPct>0.0005?(x.c.discPct*100).toFixed(1).replace('.',',')+'%':'—')+'</td>' : '') +
      '<td class="r">'+fmt.format(Math.round(x.c.unit*vk))+'</td><td class="r">'+fmt.format(Math.round(x.c.total*vk))+'</td></tr>';
  });
  const sv = svcLines();
  const cols = anyDisc ? 4 : 2;
  sv.forEach(x => {
    if (x.price !== null) tot += x.price*x.qty;
    h += '<tr><td>'+esc(x.s.name)+'</td><td class="r">'+x.qty+'</td>' + (anyDisc ? '<td></td><td></td>' : '') +
      (x.price === null ? '<td class="r muted" colspan="2">по согласованию</td>'
        : '<td class="r">'+fmt.format(Math.round(x.price*vk))+'</td><td class="r">'+fmt.format(Math.round(x.price*x.qty*vk))+'</td>') + '</tr>';
  });
  if (S.mode === 'order') h += '<tr class="tot"><td colspan="'+(cols+1)+'">Итого</td><td class="r">'+fmt.format(Math.round(tot*vk))+'</td></tr>';
  h += '</tbody></table><p class="d-cap">'+vatTxt+(S.mode==='choice' && many ? ' Комплектации предлагаются на выбор, цены не суммируются.' : '')+'</p>';

  /* Цены по объёму */
  if (k.tiers){
    const T = L.filter(x => x.c.p.id !== 'custom' || x.c.list > 0);
    if (T.length){
      /* У AeroMilk своя шкала: если в КП разные шкалы, процент пишется в ячейке */
      const one = new Set(T.map(x => JSON.stringify(tiersOf(x.c.p.type)))).size === 1;
      h += '<p style="margin-top:14px"><b>Цена за 1 шт. в зависимости от объёма заказа, ₽</b></p><table><thead><tr><th>Объём заказа</th>' + (one ? '<th class="r">Скидка</th>' : '') +
        T.map(x => '<th class="r">'+esc(x.name)+'</th>').join('') + '</tr></thead><tbody>' +
        D.tiers.map((t, j) => {
          const next = D.tiers[j+1];
          const label = next ? (t.from === next.from-1 ? t.from : t.from + '–' + (next.from-1)) + ' шт.' : 'от ' + t.from + ' шт.';
          return '<tr><td>'+label+'</td>' + (one ? '<td class="r">'+(t.pct?t.pct+'%':'—')+'</td>' : '') +
            T.map(x => { const pc = tierFor(t.from, x.c.p.type).pct;
              return '<td class="r">'+fmt.format(Math.round(x.c.list*(1-pc/100)*vk))+(one||!pc ? '' : '<br><span class="muted">−'+pc+'%</span>')+'</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table>';
    }
  }

  /* Условия */
  const cond = [['Срок поставки',k.term],['Условия оплаты',k.pay],['Гарантия',k.warranty],['Доставка',k.ship],['Срок действия предложения',k.valid]];
  h += '<h2>'+(n+1)+'. Условия</h2><table class="d-cond"><tbody>' +
    cond.map(([a,b]) => '<tr><td>'+a+'</td><td>'+(b ? esc(b) : '<span class="muted">уточнить</span>')+'</td></tr>').join('') + '</tbody></table>';
  h += '<div class="d-foot"><b>Контакты</b>\n'+esc(k.contact)+'</div>';
  return h;
}
function plural(n, a, b, c){ const m10=n%10, m100=n%100; return m10===1&&m100!==11 ? a : m10>=2&&m10<=4&&(m100<12||m100>14) ? b : c; }

/* ─── События ─── */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.v){ S.view = t.dataset.v; return render(); }
  if (t.dataset.m){ S.mode = t.dataset.m; return render(); }
  if (t.dataset.vat){ S.vat = t.dataset.vat === '1'; return render(); }
  if (t.dataset.preset){ const l = S.lines[+t.dataset.line]; l.preset = t.dataset.preset; l.extra = {}; return render(); }
  if (t.dataset.x){ const l = S.lines[+t.dataset.line]; const v = Math.max(0, (l.extra[t.dataset.x]||0) + (+t.dataset.d)); if (v) l.extra[t.dataset.x] = v; else delete l.extra[t.dataset.x]; return render(); }
  if (t.dataset.del){ S.lines.splice(+t.dataset.del, 1); return render(); }
  if (t.id === 'add'){ S.lines.push(newLine('aeromilk')); return render(); }
  /* Сброс в два нажатия: confirm() в опубликованной странице не работает */
  if (t.id === 'rst'){
    if (t.dataset.armed){ S = fresh(); delete t.dataset.armed; t.textContent = 'Сброс'; render(); }
    else { t.dataset.armed = '1'; t.textContent = 'Точно сбросить?'; setTimeout(() => { delete t.dataset.armed; t.textContent = 'Сброс'; }, 3000); }
    return;
  }
  if (t.id === 'copy'){ copyDoc(t); return; }
  if (t.id === 'prn'){ if (S.view !== 'kp'){ S.view = 'kp'; render(); } setTimeout(() => window.print(), 50); return; }
  if (t.id === 'doc'){ downloadDoc(); return; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.line !== undefined && t.dataset.f){
    S.lines[+t.dataset.line][t.dataset.f] = t.dataset.f === 'qty' ? Math.max(1, parseInt(t.value)||1) : (parseFloat(t.value)||0);
    const c = calc(S.lines[+t.dataset.line]);
    const tierEl = document.querySelector('[data-tier="'+t.dataset.line+'"]'); if (tierEl) tierEl.textContent = c.tier.pct + '%';
    renderSummary(); save(); return;
  }
  if (t.dataset.svc){
    const v = S.svc[t.dataset.svc];
    if (t.dataset.f === 'on') v.on = t.checked;
    else if (t.dataset.f === 'price') v.price = t.value === '' ? null : Math.max(0, +t.value);
    else v.qty = Math.max(1, parseInt(t.value)||1);
    t.closest('tr').className = v.on ? 'in' : 'out';
    renderSummary(); save(); return;
  }
  if (t.dataset.kp){
    S.kp[t.dataset.kp] = t.type === 'checkbox' ? t.checked : t.value;
    renderDoc(); save(); return;
  }
});

/* Копирует КП с форматированием — вставляется в Word или Google Docs.
   Если буфер обмена недоступен, выделяет документ, чтобы скопировать вручную. */
function copyDoc(btn){
  const css = document.getElementById('doc-css').textContent;
  const html = '<style>' + css + '</style><div class="doc">' + docHtml() + '</div>';
  const box = document.createElement('div'); box.innerHTML = docHtml();
  const done = msg => { btn.textContent = msg; setTimeout(() => btn.textContent = 'Скопировать КП', 2500); };
  const select = () => {
    if (S.view !== 'kp'){ S.view = 'kp'; render(); }
    const r = document.createRange(); r.selectNodeContents(document.getElementById('docv'));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    done(/Mac/.test(navigator.platform) ? 'Выделено — нажмите ⌘C' : 'Выделено — нажмите Ctrl+C');
  };
  try {
    navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html], {type:'text/html'}),
      'text/plain': new Blob([box.innerText], {type:'text/plain'})
    })]).then(() => done('Скопировано'), select);
  } catch(e){ select(); }
}

function downloadDoc(){
  const css = document.getElementById('doc-css').textContent;
  const html = '<html><head><meta charset="utf-8"><style>' + css + 'body{margin:0}</style></head><body><div class="doc">' + docHtml() + '</div></body></html>';
  const blob = new Blob(['﻿', html], {type:'application/msword'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'КП_DrinkX' + (S.kp.client ? '_' + S.kp.client.replace(/[\\/:*?"<>|]+/g,'') : '') + '.doc';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* В опубликованной странице печать и скачивание не работают — прячем их */
if (window.self !== window.top) ['prn','doc'].forEach(id => document.getElementById(id).hidden = true);

render();
})();
</script>
